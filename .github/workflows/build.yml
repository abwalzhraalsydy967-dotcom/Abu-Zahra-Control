name: Build & Release APKs

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build-control:
    name: Build Control Panel APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Print SHA1 Keys
        run: |
          echo "============================================================"
          echo "  SHA1 FINGERPRINTS - For Firebase Console"
          echo "============================================================"
          ./gradlew printSha1Keys
          echo "============================================================"
          echo "  IMPORTANT: Copy SHA1 keys above to Firebase Console"
          echo "  https://console.firebase.google.com"
          echo "  > Project: abu-zahra-control-787676787951"
          echo "  > Project Settings > Your Apps > SHA fingerprints"
          echo "============================================================"

      - name: Build Control Panel Release APK
        run: |
          echo "============================================================"
          echo "  Building Control Panel (app module)..."
          echo "============================================================"
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee control-build.txt
          echo "Build exit code: $?"

      - name: Check Control APK
        run: |
          echo "Searching for Control Panel APK..."
          find app/build/outputs -name "*.apk" 2>/dev/null || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "Control APK found!"
            ls -lh app/build/outputs/apk/release/app-release.apk
          elif [ -f app/build/outputs/apk/release/abu-zahra-control-release.apk ]; then
            echo "Control APK found at alternate path!"
            cp app/build/outputs/apk/release/abu-zahra-control-release.apk app/build/outputs/apk/release/app-release.apk
            ls -lh app/build/outputs/apk/release/app-release.apk
          else
            echo "ERROR: Control APK not found!"
            find app/build -name "*.apk" 2>/dev/null
            exit 1
          fi

      - name: Get Control Panel version
        id: ctrl_version
        run: |
          VNAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VCODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "version=$VNAME" >> $GITHUB_OUTPUT
          echo "code=$VCODE" >> $GITHUB_OUTPUT
          echo "Control Panel: v$VNAME ($VCODE)"

      - name: Upload Control Panel APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Control-v${{ steps.ctrl_version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Control build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-build-log-${{ github.run_number }}
          path: control-build.txt
          retention-days: 7

  build-client:
    name: Build Target Device APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Verify client google-services.json
        run: |
          echo "============================================================"
          echo "  Target App Firebase Configuration"
          echo "============================================================"
          if [ -f client/google-services.json ]; then
            PROJECT=$(python3 -c 'import json; d=json.load(open("client/google-services.json")); print(d["project_info"]["project_id"])')
            PKG=$(python3 -c 'import json; d=json.load(open("client/google-services.json")); print(d["client"][0]["client_info"]["android_client_info"]["package_name"])')
            echo "Project: $PROJECT"
            echo "Package: $PKG"
          else
            echo "ERROR: client/google-services.json not found!"
            exit 1
          fi

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Print SHA1 Keys
        run: |
          echo "============================================================"
          echo "  SHA1 FINGERPRINTS - For Firebase Console"
          echo "============================================================"
          ./gradlew printSha1Keys

      - name: Build Target Device Release APK
        run: |
          echo "============================================================"
          echo "  Building Target Device App (client module)..."
          echo "============================================================"
          ./gradlew :client:assembleRelease --stacktrace 2>&1 | tee client-build.txt
          echo "Build exit code: $?"

      - name: Check Client APK
        run: |
          echo "Searching for Target Device APK..."
          find client/build/outputs -name "*.apk" 2>/dev/null || true
          if [ -f client/build/outputs/apk/release/client-release.apk ]; then
            echo "Client APK found!"
            ls -lh client/build/outputs/apk/release/client-release.apk
          elif [ -f client/build/outputs/apk/release/abu-zahra-app-release.apk ]; then
            echo "Client APK found at alternate path!"
            cp client/build/outputs/apk/release/abu-zahra-app-release.apk client/build/outputs/apk/release/client-release.apk
            ls -lh client/build/outputs/apk/release/client-release.apk
          else
            echo "ERROR: Client APK not found!"
            find client/build -name "*.apk" 2>/dev/null
            exit 1
          fi

      - name: Get Client version
        id: cli_version
        run: |
          VNAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' client/build.gradle.kts | head -1)
          VCODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' client/build.gradle.kts | head -1)
          echo "version=$VNAME" >> $GITHUB_OUTPUT
          echo "code=$VCODE" >> $GITHUB_OUTPUT
          echo "Target App: v$VNAME ($VCODE)"

      - name: Upload Client APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Client-v${{ steps.cli_version.outputs.version }}
          path: client/build/outputs/apk/release/client-release.apk
          retention-days: 30

      - name: Upload Client build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-build-log-${{ github.run_number }}
          path: client-build.txt
          retention-days: 7

  release:
    name: Create Release
    needs: [build-control, build-client]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get versions
        id: versions
        run: |
          CTRL_V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          CLI_V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' client/build.gradle.kts | head -1)
          echo "control=$CTRL_V" >> $GITHUB_OUTPUT
          echo "client=$CLI_V" >> $GITHUB_OUTPUT
          echo "Control Panel: v$CTRL_V"
          echo "Target App: v$CLI_V"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find release-artifacts -name "*.apk" -exec ls -lh {} \;

      - name: Copy APKs to release folder
        run: |
          mkdir -p release-files
          # Find and copy Control Panel APK
          find release-artifacts -name "app-release.apk" -exec cp {} release-files/Abu-Zahra-Control.apk \;
          # Find and copy Client APK
          find release-artifacts -name "client-release.apk" -exec cp {} release-files/Abu-Zahra-Client.apk \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versions.outputs.control }}-client-v${{ steps.versions.outputs.client }}
          name: "Control v${{ steps.versions.outputs.control }} + Client v${{ steps.versions.outputs.client }}"
          body: |
            ## Abu Zahra - Dual APK Release

            **Built by GitHub Actions** | Run #${{ github.run_number }}

            ### Download
            | APK | Version | Description |
            |-----|---------|-------------|
            | **Abu-Zahra-Control.apk** | v${{ steps.versions.outputs.control }} | لوحة التحكم (Control Panel) |
            | **Abu-Zahra-Client.apk** | v${{ steps.versions.outputs.client }} | تطبيق الهاتف المستهدف (Target Device) |

            ### طريقة الربط (Linking Instructions)
            1. ثبت **Abu-Zahra-Control.apk** في هاتفك (لوحة التحكم)
            2. سجل دخول بحسابك
            3. اذهب إلى الإعدادات > ربط جهاز جديد
            4. اضغط **"توليد كود ربط"** وسيظهر كود من 6 أرقام
            5. ثبت **Abu-Zahra-Client.apk** في الهاتف المستهدف
            6. أدخل كود الربط المكون من 6 أرقام
            7. سيتم ربط الجهاز تلقائياً

            ### Build Info
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
          files: |
            release-files/Abu-Zahra-Control.apk
            release-files/Abu-Zahra-Client.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Abu-Zahra-Control | v${{ steps.versions.outputs.control }} | SUCCESS |" >> $GITHUB_STEP_SUMMARY
          echo "| Abu-Zahra-Client | v${{ steps.versions.outputs.client }} | SUCCESS |" >> $GITHUB_STEP_SUMMARY
