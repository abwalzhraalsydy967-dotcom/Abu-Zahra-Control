name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Show SHA1 Fingerprint
        id: sha1
        run: |
          echo "==========================================="
          echo "   SHA1 FINGERPRINT (Add to Firebase Console)"
          echo "==========================================="
          SHA1=$(keytool -list -v -keystore app/abuzahra-release.jks -storepass abuzahra2024 -alias abuzahra 2>&1 | grep SHA1 | awk '{print $2}')
          echo "SHA1=$SHA1"
          echo "SHA1=$SHA1" >> $GITHUB_ENV
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT
          echo "==========================================="
          echo "  $SHA1"
          echo "==========================================="
          echo ""
          echo "Firebase Console > Project Settings > Your Apps > Android"
          echo "Add this SHA1 to enable Google Sign-In"

      - name: Verify google-services.json
        run: |
          echo "==========================================="
          echo "   Firebase Configuration"
          echo "==========================================="
          echo "Project: $(python3 -c 'import json; d=json.load(open("app/google-services.json")); print(d["project_info"]["project_id"])')"
          echo "DB URL: $(python3 -c 'import json; d=json.load(open("app/google-services.json")); print(d["project_info"]["firebase_url"])')"
          echo "API Key: $(python3 -c 'import json; d=json.load(open("app/google-services.json")); print(d["client"][0]["api_key"][0]["current_key"])')"
          echo "Package: $(python3 -c 'import json; d=json.load(open("app/google-services.json")); print(d["client"][0]["client_info"]["android_client_info"]["package_name"])')"
          echo "==========================================="

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          echo "==========================================="
          echo "   Starting Gradle Build..."
          echo "==========================================="
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-output.txt
          echo ""
          echo "==========================================="
          echo "   Build Completed!"
          echo "==========================================="

      - name: Check APK exists
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK built successfully!"
            ls -lh app/build/outputs/apk/release/app-release.apk
          else
            echo "ERROR: APK not found!"
            exit 1
          fi

      - name: Get version info
        id: version
        run: |
          VNAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VCODE=$(sed -n 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VNAME" ]; then VNAME="1.8"; fi
          if [ -z "$VCODE" ]; then VCODE="8"; fi
          echo "version=$VNAME" >> $GITHUB_OUTPUT
          echo "code=$VCODE" >> $GITHUB_OUTPUT
          echo "Version: $VNAME ($VCODE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Control-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build-output.txt
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "v${{ steps.version.outputs.version }} - Build #${{ github.run_number }}"
          body: |
            ## Abu Zahra Control v${{ steps.version.outputs.version }}

            **Built by GitHub Actions** | Run #${{ github.run_number }}

            ### SHA1 Fingerprint (for Firebase Console)
            ```
            ${{ env.SHA1 }}
            ```

            ### Installation
            1. Download `app-release.apk` below
            2. Install on your Android device
            3. Add SHA1 above to Firebase Console > Settings > Android Apps

            ### Build Info
            - Trigger: ${{ github.event_name }}
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SHA1 Fingerprint" >> $GITHUB_STEP_SUMMARY
          echo "`${{ env.SHA1 }}`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: SUCCESS" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: $(ls -lh app/build/outputs/apk/release/app-release.apk | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "- **Download**: [Release v${{ steps.version.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
